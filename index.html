<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alfred GG33</title>
  <meta name="description" content="Clean luxury digital business card for Alfred GG33." />
  <style>
    :root{--bg:#07070a;--accent:#ff7a18;--accent2:#ffb347;--text:#fff6ef;--muted:#d0b9a8;--line:rgba(255,122,24,.22)}
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,rgba(255,122,24,.22),transparent 30%),radial-gradient(circle at 80% 0%,rgba(255,179,71,.16),transparent 30%),linear-gradient(180deg,#0b0b10,#040405 72%);color:var(--text);padding:24px}
    .card{width:min(980px,100%);margin:0 auto;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border:1px solid rgba(255,122,24,.28);border-radius:30px;box-shadow:0 30px 120px rgba(0,0,0,.62);overflow:hidden;backdrop-filter:blur(10px)}
    .hero{padding:92px 28px 52px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,122,24,.12),transparent)}
    .eyebrow{display:inline-block;color:var(--accent2);text-transform:uppercase;letter-spacing:.24em;font-size:.78rem;margin-bottom:18px;padding:8px 12px;border:1px solid rgba(255,122,24,.35);border-radius:999px;background:rgba(255,255,255,.03)}
    h1{margin:0;font-size:clamp(3.1rem,9vw,6.4rem);letter-spacing:-.06em;line-height:.9;text-shadow:0 10px 30px rgba(0,0,0,.45);color:#fff9f4}
    .sub{margin:22px auto 0;max-width:680px;color:#d6c1b2;font-size:1.06rem;line-height:1.8}
    .content{display:grid;grid-template-columns:1.2fr .8fr;gap:0}
    .left,.right{padding:32px}.left{border-right:1px solid var(--line)}
    .section-title{margin:0 0 14px;color:var(--accent2);text-transform:uppercase;letter-spacing:.18em;font-size:.8rem}
    .buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .btn{display:flex;align-items:center;justify-content:center;min-height:58px;padding:15px 18px;border-radius:18px;text-decoration:none;color:var(--text);border:1px solid rgba(255,122,24,.28);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;box-shadow:0 8px 24px rgba(0,0,0,.18)}
    .btn:hover{transform:translateY(-1px);border-color:rgba(255,179,71,.82);background:rgba(255,122,24,.16);box-shadow:0 12px 30px rgba(255,122,24,.16)}
    .panel{margin-top:20px;background:rgba(255,255,255,.035);border:1px solid rgba(255,122,24,.2);border-radius:24px;padding:24px}
    .row{display:flex;justify-content:space-between;gap:16px;color:var(--text);padding:10px 0;border-bottom:1px solid rgba(255,122,24,.1)}
    .row:last-child{border-bottom:0}
    .muted{color:var(--muted)}
    .qrbox{width:210px;aspect-ratio:1;margin:14px auto 12px;border-radius:22px;border:1px solid rgba(255,122,24,.45);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));display:grid;place-items:center;color:var(--muted);text-align:center;padding:18px;box-shadow:0 14px 40px rgba(0,0,0,.22)}
    .footer{padding:18px 28px 28px;text-align:center;border-top:1px solid var(--line);color:#d8c1b0;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase}
    .small{font-size:.88rem;color:var(--muted)}
    @media (max-width:760px){body{padding:14px}.hero{padding:48px 22px 32px}.content{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--line)}.buttons{grid-template-columns:1fr}.left,.right{padding:22px}}
  </style>
</head>
<body>
  <main class="card">
    <section class="hero">
      <div class="eyebrow">GG33 Alfred</div>
      <h1>Alfred GG33</h1>
      <p class="sub" style="max-width:560px;">
        Astrology and numerology with a clean, premium touch.
      </p>
      <p class="sub" style="max-width:380px;margin-top:10px;color:#fff;text-transform:uppercase;letter-spacing:.16em;font-size:.8rem;">
        Clarity • Direction • Presence
      </p>
    </section>

    <section class="content">
      <div class="left">
        <p class="section-title">Direct Access</p>
        <div class="buttons" style="grid-template-columns:1fr;">
          <a class="btn" href="#pricing">Scan Pricing</a>
          <a class="btn" href="https://wa.me/13236878411" target="_blank" rel="noopener">WhatsApp</a>
          <a class="btn" href="https://t.me/Alfred89snake" target="_blank" rel="noopener">Telegram</a>
        </div>
      </div>

      <div class="right">
        <p class="section-title">Pricing</p>
        <div class="panel" style="text-align:center;padding:30px 24px 28px;">
          <div class="qrbox" id="pricing" style="width:230px;border-style:solid;border-color:rgba(255,122,24,.6);box-shadow:0 18px 44px rgba(255,122,24,.08);">
            <img
              alt="QR code to pricing"
              width="180"
              height="180"
              style="width:180px;height:180px;display:block;margin:0 auto;border-radius:12px;background:#fff;padding:8px;"
              src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fgg33alfred.com%2F%23pricing"
            />
          </div>
          <div class="muted" style="font-size:1rem;margin-top:6px;">Scan to open pricing</div>
          <div class="small" style="margin-top:8px;">Fast, clean, and simple.</div>
          <div class="small" style="margin-top:6px;">X: @1lfred89 • Instagram: @gg33alfred</div>
        </div>
      </div>
    </section>

    <div class="footer">Alfred GG33</div>
  </main>
</body>
</html>
